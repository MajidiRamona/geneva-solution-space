              - { label: Link, name: url, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Image description, name: alt, widget: string }
              - { label: Link description (screen readers), name: aria, widget: string }
              - { label: Note under the card, name: note, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], minimal: true }
          - { label: Scrolling ticker lines, name: ticker, widget: list, field: { label: Line, name: line, widget: string } }
          - label: Key figures
            name: stats
            widget: list
            fields:
              - { label: "Show a “more than” sign", name: prefix, widget: select, options: [{ label: "No", value: "" }, { label: "Yes (>)", value: ">" }], required: false }
              - { label: Number, name: value, widget: string }
              - { label: Unit, name: unit, widget: string, required: false }
              - { label: Label, name: label, widget: string }
          - { label: Institutions on the outer ring, name: outer_ring, widget: list, field: { label: Name, name: name, widget: string } }
          - label: Ecosystem section
            name: ecosystem
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Heading (italic part), name: accent, widget: string }
              - { label: Paragraph 1, name: lede, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], minimal: true }
              - { label: Paragraph 2, name: lede2, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], minimal: true }
