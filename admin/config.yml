# Site editor (Decap CMS). Every save here is a commit to the GitHub repository;
# the host rebuilds the site from it within a minute or two.
#
# Login is the only host-specific part:
#   Netlify  -> backend: git-gateway (editors are invited by email in Netlify Identity)
#   Railway or any other host -> backend: github, plus a small OAuth login helper; see README.md
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Uncomment to edit locally without logging in: run `npx decap-server` in the site folder,
# serve the site with `python3 -m http.server 8000`, and open http://localhost:8000/admin/
# local_backend: true

site_url: https://genevasolutionspace.ch
show_preview_links: false
display_url: https://genevasolutionspace.ch
logo_url: /assets/logos/gss-gear.png
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    identifier_field: title
    description: News and writing from the space. Newest first on the blog page. Press “Publish” when you are done; the site updates within about two minutes.
    folder: content/posts
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: Excerpt, name: excerpt, widget: text, hint: "One or two sentences shown on the blog page.", required: false }
      - { label: Cover image, name: thumb, widget: image, required: false }
      - { label: "Keep as draft (not shown on the site)", name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Sort tiebreak, name: sort, widget: hidden, required: false }

  - name: events
    editor:
      preview: false
    label: Events
    label_singular: Event
    description: Upcoming events appear on the homepage and What We Do; once the date has passed they move to the past-events list automatically.
    folder: content/events
    extension: json
    format: json
    create: true
    slug: "{{slug}}-{{year}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: Kind, name: kind, widget: string, hint: "Short label, e.g. Networking, Hackathon, Workshop.", required: false }
      - { label: Colour, name: colour, widget: select, options: [teal, coral, amber, blue], default: teal }
      - { label: Blurb, name: blurb, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], minimal: true, hint: "One or two sentences. Shown on the homepage and the event page.", required: false }
      - { label: Details, name: body, widget: markdown, required: false, hint: "Optional longer description for the event page." }
      - { label: External link, name: link, widget: string, required: false, hint: "Optional programme or registration page, e.g. https://iapero.eventwise.ch/… Event cards then open this link." }
      - { label: External link label, name: link_label, widget: string, required: false, hint: "Defaults to “Programme & registration”." }

  - name: partners
    editor:
      preview: false
    label: Partners
    label_singular: Partner
    description: Organizations on the ecosystem wheel and the Partners page.
    folder: content/partners
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    media_folder: /assets/logos
    public_folder: /assets/logos
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Logo, name: logo, widget: image, hint: "Square works best." }
      - { label: Website, name: url, widget: string, required: false }
      - { label: Website, short form, name: domain, widget: string, required: false, hint: "What the link should say, e.g. opengeneva.org. Leave empty to hide the link." }
      - { label: Description, name: description, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], minimal: true }
      - { label: Position on the wheel (1 = top), name: order, widget: number, value_type: int, min: 1, required: false }

  - name: pages
    editor:
      preview: false
    label: Pages
    description: The words on each page, section by section. Select text to make it bold or add a link.
    files:
      - name: site
        label: Site settings (footer, address)
        file: content/site.json
        fields:
          - { label: Site name, name: name, widget: string }
          - { label: Contact email, name: email, widget: string }
          - { label: Address, name: address, widget: list, field: { label: Line, name: line, widget: string } }
          - { label: Header button label, name: nav_cta_label, widget: string }
          - { label: Copyright line, name: copyright, widget: string }
          - label: Footer links
