<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Site editor | Geneva Solution Space</title>
  <link rel="icon" href="/assets/logos/gss-gear.png">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .gss-help { position: fixed; right: 18px; bottom: 18px; z-index: 9999; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #0E1526; color: #F5F2EB; font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .gss-help:hover { background: #3563E9; }
    .gss-help svg { width: 18px; height: 18px; }
    .gss-bookings { right: auto; left: 18px; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Previews look like the real site: same fonts, styles and blog post layout.
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap');
    CMS.registerPreviewStyle('/styles.css');
    CMS.registerPreviewStyle('body { background: #F5F2EB; margin: 0; } .post { padding-top: 40px; } .gss-draft { display: inline-block; font: 600 12px/1 sans-serif; letter-spacing: .08em; text-transform: uppercase; background: #E9A23B; color: #fff; padding: 6px 10px; border-radius: 999px; }', { raw: true });
    function prettyDate(v) {
      if (!v) return '';
      var d = new Date(String(v).slice(0, 10) + 'T12:00:00Z');
      return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
    var PostPreview = createClass({
      render: function () {
        var e = this.props.entry, data = function (k) { return e.getIn(['data', k]); };
        var thumb = data('thumb'), img = thumb ? this.props.getAsset(thumb) : null;
        return h('article', { className: 'post container' },
          data('draft') ? h('span', { className: 'gss-draft' }, 'Draft — not visible on the site') : null,
          h('p', { className: 'eyebrow' }, prettyDate(data('date'))),
          h('h1', {}, data('title') || 'Untitled post'),
          data('excerpt') ? h('p', { className: 'post-lede' }, data('excerpt')) : null,
          img ? h('figure', { className: 'post-hero' }, h('img', { src: img.toString(), alt: '' })) : null,
          h('div', { className: 'prose' }, this.props.widgetFor('body')));
      }
    });
    CMS.registerPreviewTemplate('posts', PostPreview);
  </script>
  <a class="gss-help" href="/admin/help.html" target="_blank" rel="noopener" title="How to edit this site">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"></circle><path d="M9.6 9.6a2.4 2.4 0 1 1 3.6 2.1c-.8.5-1.2 1-1.2 1.9M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    How to edit this site
  </a>
  <a class="gss-help gss-bookings" href="/admin/bookings/" title="Review booking requests">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"></rect><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
    Bookings
  </a>
</body>
</html>
